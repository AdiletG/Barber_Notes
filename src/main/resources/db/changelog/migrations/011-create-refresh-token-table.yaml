databaseChangeLog:
  - changeSet:
      id: 011
      author: AdiletG
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: subject_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: subject_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: replaced_by_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: "ALTER TABLE refresh_token ADD CONSTRAINT chk_subject_type CHECK (subject_type IN ('CUSTOMER', 'STAFF'));"

        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_subject_id
            unique: false
            columns:
              - column:
                  name: subject_id

        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_hash
            unique: false
            columns:
              - column:
                  name: token_hash