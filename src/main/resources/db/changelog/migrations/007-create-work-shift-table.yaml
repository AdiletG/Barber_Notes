databaseChangeLog:
  - changeSet:
      id: 007
      author: AdiletG
      changes:
        - createTable:
            tableName: work_shift
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: barber_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: work_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: work_shift
            columnNames: barber_id, work_date
            constraintName: uq_barber_id_work_date

        - addForeignKeyConstraint:
            constraintName: fk_work_shift_for_barber
            baseTableName: work_shift
            baseColumnNames: barber_id
            referencedTableName: barber
            referencedColumnNames: id
            onDelete: RESTRICT

        - sql:
            sql: "ALTER TABLE work_shift ADD CONSTRAINT chk_time_work_shift CHECK (start_time < end_time);"

        - sql:
            sql: "ALTER TABLE work_shift ADD CONSTRAINT chk_hour_work_shift CHECK (end_time - start_time >= interval '1 hour');"

        - createIndex:
            tableName: work_shift
            indexName: idx_work_shift_barber_id
            unique: false
            columns:
              - column:
                  name: barber_id