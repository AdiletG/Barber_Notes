databaseChangeLog:
  - changeSet:
      id: 004
      author: AdiletG
      changes:
        - createTable:
            tableName: barber
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: experience_years
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_barber_for_branch
            baseTableName: barber
            baseColumnNames: branch_id
            referencedTableName: branch
            referencedColumnNames: id
            onDelete: RESTRICT

        - sql:
            sql: "ALTER TABLE barber ADD CONSTRAINT chk_status_barber CHECK (status IN ('ACTIVE', 'INACTIVE'));"

        - sql:
            sql: "ALTER TABLE barber ADD CONSTRAINT chk_experience_years_barber CHECK (experience_years >= 0);"

        - createIndex:
            tableName: barber
            indexName: idx_barber_status
            unique: false
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: barber
            indexName: idx_barber_branch_id
            unique: false
            columns:
              - column:
                  name: branch_id